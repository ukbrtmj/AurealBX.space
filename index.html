<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Domínio - Jogo de Estratégia</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Roboto+Slab:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="homeScreen">
    <div class="container">
      <img src="https://file.garden/anP6_SXXiQfEPX26/file_000000000c14820e9f74ff8e3421f51c.png" alt="Logo" class="logo" oncontextmenu="return false;" draggable="false">
      <div class="button-group">
        <button class="btn" id="btnOnline">Online</button>
        <button class="btn" id="btnLocal">Local</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="popupNome">
    <div class="modal">
      <h2>Personalizar seu Perfil</h2>
      <label for="uploadFoto" class="avatar-upload" title="Escolha uma foto">
        <div class="avatar-preview" id="avatarPreview">?</div>
        <div class="avatar-badge"><i data-lucide="camera"></i></div>
      </label>
      <input type="file" id="uploadFoto" accept="image/*">
      <input type="text" id="nomeUsuario" placeholder="Digite seu nome..." autocomplete="off" maxlength="15">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancelarNome">Cancelar</button>
        <button class="btn" id="btnConfirmarNome">Entrar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="popupOpcoes">
    <div class="modal">
      <h2>Modo de Jogo</h2>
      <div class="options-section">
        <button class="btn btn-menu btn-secondary" id="btnAbrirCodigo">Colocar Código</button>
        <button class="btn btn-menu" id="btnHost">Host</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="popupCodigo">
    <div class="modal">
      <h2>Digite o Código</h2>
      <input type="text" id="inputCodigoSala" placeholder="EX: A1B2C" autocomplete="off" maxlength="5" style="text-transform: uppercase;">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnVoltarCodigo">Voltar</button>
        <button class="btn" id="btnEntrarCodigo">Entrar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="popupHost">
    <div class="modal">
      <div class="host-header">
        <div class="code-container">
          <span class="code-label">Código da Sala</span>
          <div class="code-box">
            <span class="code-display" id="codigoDisplay">*****</span>
            <button class="btn-icon" id="btnToggleCodigo" title="Mostrar/Ocultar Código"><i data-lucide="eye" id="iconEye"></i></button>
          </div>
        </div>
        <button class="btn btn-secondary btn-config" id="btnConfigSala">
          <i data-lucide="settings"></i> Configurações
        </button>
      </div>

      <h2>Sala de Espera</h2>
      <span class="players-list-title">Jogadores Conectados</span>
      <div class="players-list" id="listaJogadores"></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnSairHost">Sair</button>
        <button class="btn" id="btnIniciarPartida">Iniciar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="popupConfig">
    <div class="modal">
      <h2>Configurações</h2>
      <label style="color: #888899; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; align-self: flex-start; font-weight: 700;">Escolha o Mapa</label>
      <select id="selectMapa">
        <option value="AFRICA">África (Até 6 Jogadores)</option>
      </select>
      <div class="modal-actions">
        <button class="btn" id="btnSalvarConfig">Salvar</button>
      </div>
    </div>
  </div>

  <div id="countdownOverlay" class="countdown-overlay">
    <div class="countdown-card">
      <span class="countdown-title">A partida começará em</span>
      <span id="countdownNumber" class="countdown-number">5</span>
    </div>
  </div>

  <div id="hud">
    <div id="bar"></div>
    <div id="controls">
      <div id="legend"></div>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="game"></canvas>
  </div>

  <script src="js/entities.js"></script>
  <script src="maps/Africa/africa.js"></script>
  <script src="js/game.js"></script>

  <script>
    lucide.createIcons();

    // Elementos DOM
    const homeScreen = document.getElementById('homeScreen');
    const btnOnline = document.getElementById('btnOnline');
    const btnLocal = document.getElementById('btnLocal');
    
    const popupNome = document.getElementById('popupNome');
    const uploadFoto = document.getElementById('uploadFoto');
    const avatarPreview = document.getElementById('avatarPreview');
    const nomeUsuario = document.getElementById('nomeUsuario');
    const btnCancelarNome = document.getElementById('btnCancelarNome');
    const btnConfirmarNome = document.getElementById('btnConfirmarNome');

    const popupOpcoes = document.getElementById('popupOpcoes');
    const btnAbrirCodigo = document.getElementById('btnAbrirCodigo');
    const btnHost = document.getElementById('btnHost');

    const popupCodigo = document.getElementById('popupCodigo');
    const inputCodigoSala = document.getElementById('inputCodigoSala');
    const btnVoltarCodigo = document.getElementById('btnVoltarCodigo');
    const btnEntrarCodigo = document.getElementById('btnEntrarCodigo');

    const popupHost = document.getElementById('popupHost');
    const codigoDisplay = document.getElementById('codigoDisplay');
    const btnToggleCodigo = document.getElementById('btnToggleCodigo');
    const iconEye = document.getElementById('iconEye');
    const listaJogadores = document.getElementById('listaJogadores');
    const btnSairHost = document.getElementById('btnSairHost');
    const btnIniciarPartida = document.getElementById('btnIniciarPartida');

    const popupConfig = document.getElementById('popupConfig');
    const btnConfigSala = document.getElementById('btnConfigSala');
    const btnSalvarConfig = document.getElementById('btnSalvarConfig');

    // Variáveis do Jogador e Sala
    let me = { nome: '', foto: null };
    let peer = null;
    let conexoes = [];
    let conexaoHost = null;
    let isHost = false;
    let salaCodigo = '';
    let codigoVisivel = false;
    let jogadores = [];
    let meuId = 1;

    // Foto de Perfil
    uploadFoto.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          me.foto = evt.target.result;
          avatarPreview.style.backgroundImage = `url(${me.foto})`;
          avatarPreview.textContent = '';
        };
        reader.readAsDataURL(file);
      }
    });

    btnOnline.addEventListener('click', () => {
      if (!me.nome) {
        popupNome.classList.add('active');
      } else {
        popupOpcoes.classList.add('active');
      }
    });

    // Partida Solo / Local
    btnLocal.addEventListener('click', () => {
      if (typeof iniciarPartidaComTimer === 'function') {
        iniciarPartidaComTimer(1, 1, []);
      }
    });

    btnCancelarNome.addEventListener('click', () => popupNome.classList.remove('active'));

    btnConfirmarNome.addEventListener('click', () => {
      const nomeVal = nomeUsuario.value.trim();
      if (!nomeVal) return alert('Por favor, digite seu nome!');
      me.nome = nomeVal;
      popupNome.classList.remove('active');
      setTimeout(() => popupOpcoes.classList.add('active'), 200);
    });

    btnAbrirCodigo.addEventListener('click', () => {
      popupOpcoes.classList.remove('active');
      setTimeout(() => popupCodigo.classList.add('active'), 200);
    });

    btnVoltarCodigo.addEventListener('click', () => {
      popupCodigo.classList.remove('active');
      setTimeout(() => popupOpcoes.classList.add('active'), 200);
    });

    // Função para Gerar Código P2P
    function gerarCodigoUnico() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    // Criar Sala como Host
    btnHost.addEventListener('click', () => {
      popupOpcoes.classList.remove('active');
      isHost = true;
      meuId = 1;
      salaCodigo = gerarCodigoUnico();
      jogadores = [{ id: 1, nome: me.nome, foto: me.foto, isHost: true }];
      
      atualizarLobbyUI();
      popupHost.classList.add('active');
      btnIniciarPartida.style.display = 'inline-flex';

      peer = new Peer('DOMINIO-' + salaCodigo);
      peer.on('open', () => {
        atualizarDisplayCodigo();
      });

      peer.on('connection', (conn) => {
        if (jogadores.length >= 6) {
          conn.send({ tipo: 'ERRO', msg: 'A sala está cheia!' });
          setTimeout(() => conn.close(), 500);
          return;
        }

        conexoes.push(conn);

        conn.on('data', (data) => {
          if (data.tipo === 'ENTRAR') {
            const novoPlayerId = jogadores.length + 1;
            const novoJogador = { id: novoPlayerId, nome: data.nome, foto: data.foto, isHost: false };
            jogadores.push(novoJogador);

            conn.send({ tipo: 'BOAS_VINDAS', meuId: novoPlayerId, jogadores });
            transmitirParaTodos({ tipo: 'ATUALIZAR_JOGADORES', jogadores });
            atualizarLobbyUI();
          } else if (data.tipo === 'ATAQUE') {
            // Repassa ataques recebidos para todos os outros clientes
            transmitirParaTodos(data, conn);
            if (typeof criarOndaMovimento === 'function') {
              criarOndaMovimento(data.fromId, data.toId, data.amount, data.owner);
            }
          }
        });

        conn.on('close', () => {
          conexoes = conexoes.filter(c => c !== conn);
        });
      });
    });

    // Entrar em uma sala existente
    btnEntrarCodigo.addEventListener('click', () => {
      const code = inputCodigoSala.value.trim().toUpperCase();
      if (code.length !== 5) return alert('Digite um código válido de 5 caracteres.');

      btnEntrarCodigo.disabled = true;
      isHost = false;
      salaCodigo = code;

      peer = new Peer();
      peer.on('open', () => {
        conexaoHost = peer.connect('DOMINIO-' + salaCodigo);

        conexaoHost.on('open', () => {
          conexaoHost.send({ tipo: 'ENTRAR', nome: me.nome, foto: me.foto });
        });

        conexaoHost.on('data', (data) => {
          if (data.tipo === 'BOAS_VINDAS') {
            meuId = data.meuId;
            jogadores = data.jogadores;
            btnEntrarCodigo.disabled = false;
            popupCodigo.classList.remove('active');
            popupHost.classList.add('active');
            btnIniciarPartida.style.display = 'none';
            atualizarLobbyUI();
          } else if (data.tipo === 'ATUALIZAR_JOGADORES') {
            jogadores = data.jogadores;
            atualizarLobbyUI();
          } else if (data.tipo === 'INICIAR_PARTIDA') {
            popupHost.classList.remove('active');
            if (typeof iniciarPartidaComTimer === 'function') {
              iniciarPartidaComTimer(jogadores.length, meuId, [conexaoHost]);
            }
          } else if (data.tipo === 'ATAQUE') {
            if (typeof criarOndaMovimento === 'function') {
              criarOndaMovimento(data.fromId, data.toId, data.amount, data.owner);
            }
          } else if (data.tipo === 'ERRO') {
            alert(data.msg);
            btnEntrarCodigo.disabled = false;
          }
        });
      });

      peer.on('error', () => {
        alert('Não foi possível encontrar a sala com este código!');
        btnEntrarCodigo.disabled = false;
      });
    });

    function transmitirParaTodos(dados, conexaoExcluida = null) {
      conexoes.forEach(conn => {
        if (conn && conn.open && conn !== conexaoExcluida) {
          conn.send(dados);
        }
      });
    }

    // Iniciar Partida
    btnIniciarPartida.addEventListener('click', () => {
      if (isHost) {
        transmitirParaTodos({ tipo: 'INICIAR_PARTIDA' });
        popupHost.classList.remove('active');
        if (typeof iniciarPartidaComTimer === 'function') {
          iniciarPartidaComTimer(jogadores.length, 1, conexoes);
        }
      }
    });

    // Atualização da Interface da Sala
    function atualizarDisplayCodigo() {
      codigoDisplay.textContent = codigoVisivel ? salaCodigo : '*****';
      iconEye.setAttribute('data-lucide', codigoVisivel ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    btnToggleCodigo.addEventListener('click', () => {
      codigoVisivel = !codigoVisivel;
      atualizarDisplayCodigo();
    });

    function atualizarLobbyUI() {
      atualizarDisplayCodigo();
      listaJogadores.innerHTML = '';
      jogadores.forEach(j => {
        const item = document.createElement('div');
        item.className = 'player-item';
        
        const avatar = document.createElement('div');
        avatar.className = 'player-avatar';
        if (j.foto) avatar.style.backgroundImage = `url(${j.foto})`;
        else avatar.textContent = j.nome.charAt(0).toUpperCase();

        const name = document.createElement('span');
        name.className = 'player-name';
        name.textContent = j.nome;
        if (j.isHost) name.innerHTML += ' <i data-lucide="crown" class="crown-icon"></i>';

        item.appendChild(avatar);
        item.appendChild(name);
        listaJogadores.appendChild(item);
      });
      lucide.createIcons();
    }

    // Configurações
    btnConfigSala.addEventListener('click', () => popupConfig.classList.add('active'));
    btnSalvarConfig.addEventListener('click', () => popupConfig.classList.remove('active'));

    btnSairHost.addEventListener('click', () => {
      if (peer) peer.destroy();
      conexoes = [];
      popupHost.classList.remove('active');
      setTimeout(() => popupOpcoes.classList.add('active'), 200);
    });

    // Fechar overlays clicando fora
    [popupNome, popupOpcoes, popupCodigo, popupHost, popupConfig].forEach(modal => {
      modal.addEventListener('click', (e) => { 
        if (e.target === modal) modal.classList.remove('active'); 
      });
    });
  </script>
</body>
</html>
